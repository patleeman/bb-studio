# See docs/MONOREPO.md, "CI and the stable branch".
name: iOS

# Manual only: GitHub's macOS runners take an hour or more and often queue.
# The TestFlight gate is the full iOS suite run locally on a clean checkout.
on:
  workflow_dispatch:

concurrency:
  group: ios-${{ github.ref }}
  cancel-in-progress: true

jobs:
  ios:
    runs-on: macos-latest
    timeout-minutes: 150
    defaults:
      run:
        working-directory: ios
    steps:
      - uses: actions/checkout@v4
      - uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: latest
      - name: XcodeGen
        run: |
          ls -d /Applications/Xcode*.app
          xcodebuild -version
          brew install xcodegen
      - name: Swift 6 checks (transcript and voice-live)
        run: |
          echo "DEVELOPER_DIR=$(xcode-select -p)" >> "$GITHUB_ENV"
          DEVELOPER_DIR="$(xcode-select -p)" scripts/check-transcript-swift6.sh
          DEVELOPER_DIR="$(xcode-select -p)" scripts/check-voice-live-swift6.sh
      - name: Build once and check type-check times (nothing over 1.5 s)
        run: TYPE_CHECK_DERIVED_DATA=build/ci/DerivedData scripts/check-type-check-times.sh
      - name: Simulators
        run: |
          xcrun simctl list -j devicetypes runtimes > "$RUNNER_TEMP/sim.json"
          read -r phone_runtime phone duo_runtime duo < <(python3 - "$RUNNER_TEMP/sim.json" <<'PY'
          import json, re, sys
          data = json.load(open(sys.argv[1]))
          kinds = {d["identifier"]: d["name"] for d in data["devicetypes"]}
          runtimes = [r for r in data["runtimes"] if r.get("isAvailable") and r["identifier"].split(".")[-1].startswith("iOS")]
          runtimes.sort(key=lambda r: [int(p) for p in r["version"].split(".")], reverse=True)
          def newest(match):
              for runtime in runtimes:
                  names = [d["identifier"] for d in runtime.get("supportedDeviceTypes", []) if match(kinds.get(d["identifier"], ""))]
                  if names:
                      model = lambda i: int(re.search(r"\d+", kinds[i]).group()) if re.search(r"\d+", kinds[i]) else 0
                      return runtime["identifier"], max(names, key=model)
              return "-", "-"
          phone = newest(lambda n: n.startswith("iPhone") and n.endswith("Pro"))
          duo = newest(lambda n: n == "iPhone Duo")
          print(*phone, *duo)
          PY
          )
          phone_id=$(xcrun simctl create ci-phone "$phone" "$phone_runtime")
          xcrun simctl boot "$phone_id"
          xcrun simctl bootstatus "$phone_id" -b
          echo "BB_TEST_SIMULATOR_ID=$phone_id" >> "$GITHUB_ENV"
          if [ "$duo" != "-" ]; then
            duo_id=$(xcrun simctl create ci-duo "$duo" "$duo_runtime")
            xcrun simctl boot "$duo_id"
            xcrun simctl bootstatus "$duo_id" -b
            echo "BB_TEST_DUO_SIMULATOR_ID=$duo_id" >> "$GITHUB_ENV"
          fi
          echo "phone=$phone on $phone_runtime, duo=$duo on $duo_runtime"
      - name: Smoke suite (unit tests without replay + core offline UI suites)
        run: SKIP_BUILD=1 SMOKE_DERIVED_DATA=build/ci/DerivedData scripts/test-smoke.sh
      - name: Transcript tests (state machine, replay, UI tests on phone + duo)
        run: SKIP_BUILD=1 TRANSCRIPT_DERIVED_DATA=build/ci/DerivedData scripts/test-transcript.sh
      - name: Keep the results
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: ios-xcresults
          path: ios/build/**/*.xcresult
          if-no-files-found: ignore
